<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CCCJB Connect" />
    <meta name="description" content="新山加略山社区教会 CCCJB Connect 服事排班看板与同工助手" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CCCJB Connect | 新山加略山社区教会服事看板</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('calvary_theme_mode');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode !== 'light' && systemDark);
          var meta = document.getElementById('theme-color-meta') || document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100/70 dark:bg-black antialiased selection:bg-blue-100 dark:selection:bg-zinc-800 selection:text-blue-900 dark:selection:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
